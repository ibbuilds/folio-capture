# Active defaults use supported UI reference-library adapters.
# Direct original webpage URLs can also be added to sources.
# The output folder is resolved relative to this file; an absolute path also works.
output: ./output
freshnessDays: 730
classifier:
  runner: codex # Use none for a completely model-free run.
  model: gpt-6.1-sol
  reasoning: high
quality:
  maxImages: 24 # Larger subjects remain uncertain rather than sampling unseen frames.
  quarantineDays: 30 # Applied only by the explicit prune command.
sources:
  - url: https://recent.design/websites
    kind: library
    name: Recent websites
  - url: https://styles.refero.design/
    kind: library
    name: Refero Styles

  # Selected UI libraries awaiting dedicated traversal adapters; inactive.
