# Selected UI reference libraries from the supplied list.
# The adapter registry covers these selected website, section and app-reference collections.
# Access gates, changed structures and missing original links remain recorded exceptions.
# Direct original webpage URLs can also be added to sources.
# The output folder is resolved relative to this file; an absolute path also works.
output: ./output
freshnessDays: 730
classifier:
  runner: codex # Use none for a completely model-free run.
  model: gpt-6.1-sol
  reasoning: high
quality:
  maxImages: 24 # Larger subjects remain uncertain rather than sampling unseen frames.
  quarantineDays: 30 # Applied only by the explicit prune command.
sources:
  # Product styles and current websites:
  - url: https://recent.design/websites
    kind: library
    name: Recent websites
  - url: https://styles.refero.design/
    kind: library
    name: Refero Styles

  # Website and landing-page libraries:
  - {url: https://refs.gallery/, kind: library, name: Refs.Gallery}
  - {url: https://www.siteofsites.co/, kind: library, name: Site of Sites}
  - {url: https://www.awwwards.com/websites/sites_of_the_day/, kind: library, name: Awwwards Sites of the Day}
  - {url: https://www.a1.gallery/, kind: library, name: A1 Gallery websites}
  - {url: https://www.a1.gallery/pages, kind: library, name: A1 Gallery pages}
  - {url: https://maxibestof.one/, kind: library, name: MaxiBestOf}
  - {url: https://www.siteinspire.com/, kind: library, name: SiteInspire}
  - {url: https://minimal.gallery/, kind: library, name: Minimal Gallery}
  - {url: https://curated.design/, kind: library, name: Curated websites}
  - {url: https://www.hoverstat.es/, kind: library, name: HOVERSTAT.ES}
  - {url: https://inspomcp.dev/screens, kind: library, name: Inspo archive}
  - {url: https://www.lapa.ninja/, kind: library, name: Lapa Ninja landing pages}
  - {url: https://saaspo.com/, kind: library, name: Saaspo pages}
  - {url: https://www.landingfolio.com/, kind: library, name: Landingfolio}
  - {url: https://onepagelove.com/inspiration, kind: library, name: One Page Love websites}
  - {url: https://www.landing.love/, kind: library, name: Landing.Love}

  # Section and page-detail libraries:
  - {url: https://www.awwwards.com/elements/, kind: library, name: Awwwards Elements}
  - {url: https://www.a1.gallery/sections, kind: library, name: A1 Gallery sections}
  - {url: https://curated.design/sections/, kind: library, name: Curated sections}
  - {url: https://www.lapa.ninja/elements/, kind: library, name: Lapa Ninja sections}
  - {url: https://saaspo.com/sections, kind: library, name: Saaspo sections}
  - {url: https://onepagelove.com/sections, kind: library, name: One Page Love sections}
  - {url: https://www.navbar.gallery/, kind: library, name: Navbar Gallery}
  - {url: https://supahero.io/, kind: library, name: Supahero}
  - {url: https://www.unsection.com/, kind: library, name: Unsection}
  - {url: https://www.footer.design/, kind: library, name: Footer Design}
  - {url: https://www.cta.gallery/, kind: library, name: CTA Gallery}
  - {url: https://gridddy.framer.website/, kind: library, name: Gridddy}
  - {url: https://www.404s.design/, kind: library, name: 404s}
  - {url: https://bentogrids.com/, kind: library, name: Bento Grids}

  # Product-screen and interaction reference libraries:
  # Resolve their public original URLs; native app and recorded-video capture is separate.
  - {url: https://recent.design/app-store-screenshots, kind: library, name: Recent app screenshots}
  - {url: https://60fps.design/, kind: library, name: 60fps}
  - {url: https://designspells.com/, kind: library, name: Design Spells}

