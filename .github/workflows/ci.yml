name: Verify Folio Capture

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: folio-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.15.0
      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/pnpm-store
          key: ${{ runner.os }}-pnpm-12-${{ hashFiles('pnpm-lock.yaml') }}
      - run: corepack pnpm install --frozen-lockfile --store-dir "${{ runner.temp }}/pnpm-store"
      - run: corepack pnpm exec playwright install --with-deps chromium --no-shell
      - run: corepack pnpm run check
      - run: corepack pnpm test
