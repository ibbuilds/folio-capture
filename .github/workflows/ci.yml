name: Verify Folio Capture

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: folio-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.15.0
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium --no-shell
      - run: npm run build
      - run: npm test
